name: Oracle Cross-Version LOB Tests

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      full:
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  oracle-lob-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FULL: ${{ inputs.full || false }}
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-java@v6
      with:
        java-version: '17'
        distribution: temurin
        cache: maven
        cache-dependency-path: pom.xml
    - name: Free disk space for Oracle images
      run: sudo rm -rf /usr/local/lib/android/sdk /usr/share/dotnet /opt/ghc
    - name: Run cross-version LOB suite
      run: |
        set -euo pipefail
        tests=(-Dtest=Oracle2OracleCrossVersionLobTest)
        if [[ "$FULL" != true ]]; then
          tests+=(-DexcludedGroups=oracle-large-lob)
        fi
        mvn -B test "${tests[@]}"
    - name: Verify the test cases ran
      run: |
        python3 - <<'PY'
        import os
        import xml.etree.ElementTree as ET

        report = ET.parse('target/surefire-reports/TEST-org.replicadb.oracle.Oracle2OracleCrossVersionLobTest.xml')
        cases = report.findall('testcase')
        large_case = 'testCrossVersionLargeLobReplication'
        has_small_cases = any(case.get('name') != large_case for case in cases)
        has_large_case = any(case.get('name') == large_case for case in cases)
        full = os.environ['FULL'] == 'true'
        if not has_small_cases or has_large_case != full or any(case.find('skipped') is not None for case in cases):
            raise SystemExit('Oracle cross-version LOB tests did not match the selected profile')
        PY
    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: oracle-lob-test-results
        path: target/surefire-reports/TEST-*.xml
        retention-days: 7
