name: Oracle Cross-Version LOB Tests

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      full:
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  oracle-lob-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FULL: ${{ inputs.full || false }}
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-java@v6
      with:
        java-version: '17'
        distribution: temurin
        show-download-progress: true
        cache: maven
        cache-dependency-path: |
          pom.xml
          .github/workflows/maven-cache-ci-probe.yml
    - name: Free disk space for Oracle images
      run: |
        set -euo pipefail
        if [[ "$FULL" == true ]]; then
          sudo rm -rf /usr/local/lib/android/sdk /usr/share/dotnet /opt/ghc
          exit 0
        fi

        docker_root=$(docker info --format '{{.DockerRootDir}}')
        # Fast LOB CI used about 17.3 GiB at peak in the disk benchmark.
        minimum_free=$((24 * 1024 * 1024 * 1024))
        disk_available() {
          sudo df -B1 --output=avail "$docker_root" | awk 'NR == 2 {print $1}'
        }

        available=$(disk_available)
        printf 'Docker storage before cleanup: %s bytes free (target: %s bytes)\n' "$available" "$minimum_free"
        if (( available < minimum_free )); then
          echo 'Freeing space by removing the preinstalled .NET SDK'
          sudo rm -rf /usr/share/dotnet
          available=$(disk_available)
        fi
        if (( available < minimum_free )); then
          echo 'Freeing more space by removing the preinstalled Android SDK'
          sudo rm -rf /usr/local/lib/android/sdk
          available=$(disk_available)
        fi
        printf 'Docker storage ready for Oracle: %s bytes free\n' "$available"
    - name: Run cross-version LOB suite
      run: |
        set -euo pipefail
        tests=(-Dtest=Oracle2OracleCrossVersionLobTest)
        if [[ "$FULL" != true ]]; then
          tests+=(-DexcludedGroups=oracle-large-lob)
        fi
        mvn -B test "${tests[@]}"
    - name: Verify the test cases ran
      run: |
        python3 - <<'PY'
        import os
        import xml.etree.ElementTree as ET

        report = ET.parse('target/surefire-reports/TEST-org.replicadb.oracle.Oracle2OracleCrossVersionLobTest.xml')
        cases = report.findall('testcase')
        large_case = 'testCrossVersionLargeLobReplication'
        has_small_cases = any(case.get('name') != large_case for case in cases)
        has_large_case = any(case.get('name') == large_case for case in cases)
        full = os.environ['FULL'] == 'true'
        if not has_small_cases or has_large_case != full or any(case.find('skipped') is not None for case in cases):
            raise SystemExit('Oracle cross-version LOB tests did not match the selected profile')
        PY
    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: oracle-lob-test-results
        path: target/surefire-reports/TEST-*.xml
        retention-days: 7
