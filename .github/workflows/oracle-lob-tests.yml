name: Oracle Cross-Version LOB Tests

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  oracle-lob-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-java@v6
      with:
        java-version: '17'
        distribution: temurin
        cache: maven
        cache-dependency-path: pom.xml
    - name: Free disk space for Oracle images
      run: sudo rm -rf /usr/local/lib/android/sdk /usr/share/dotnet /opt/ghc
    - name: Run cross-version LOB suite
      run: mvn -B test -Dtest=Oracle2OracleCrossVersionLobTest
    - name: Verify the test cases ran
      run: |
        python3 - <<'PY'
        import xml.etree.ElementTree as ET

        report = ET.parse('target/surefire-reports/TEST-org.replicadb.oracle.Oracle2OracleCrossVersionLobTest.xml')
        cases = report.findall('testcase')
        if not cases or any(case.find('skipped') is not None for case in cases):
            raise SystemExit('Oracle cross-version LOB tests did not all run')
        PY
    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: oracle-lob-test-results
        path: target/surefire-reports/TEST-*.xml
        retention-days: 7
