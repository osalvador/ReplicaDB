# This workflow will build a Java project with Maven
# For more information see: https://help.github.com/actions/language-and-framework-guides/building-and-testing-java-with-maven

name: Only CI/CT

on:
  push:
    branches: [ master ]
    paths-ignore:
      - 'README.md'
      - 'docs/**'
  pull_request:
    branches: [ master ]
    paths-ignore:
      - 'README.md'
      - 'docs/**'

env:
  TESTCONTAINERS_REUSE_ENABLE: 'false'

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TESTCONTAINERS_CONFIG_FILE: src/test/resources/testcontainers-ci.properties
      DOCKER_HOST: unix:///var/run/docker.sock
      TESTCONTAINERS_DOCKER_SOCKET_OVERRIDE: /var/run/docker.sock
    strategy:
      fail-fast: false
      matrix:
        source:
          - db2
          - mariadb
          - mysql
          - oracle
          - postgres
          - sqlite
          - sqlserver
          - mongo
    name: Integration (${{ matrix.source }})

    steps:
    - uses: actions/checkout@v7
    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'
        server-id: github # Value of the distributionManagement/repository/id field of the pom.xml
        settings-path: ${{ github.workspace }} # location for the settings.xml file

    - name: Check Docker info
      run: docker info

    - name: Get version
      run: |
        project_version="\${project.version}"
        version="$(mvn -q -Dexec.executable=echo -Dexec.args="$project_version" --non-recursive exec:exec)"
        echo "version=$version" >> "$GITHUB_ENV"

    - name: Integration tests (exclude Oracle cross-version)
      run: mvn -B test --file pom.xml -Dtest="org/replicadb/${{ matrix.source }}/*Test,!org/replicadb/oracle/Oracle2OracleCrossVersionLobTest,!org/replicadb/mongo/Mongo2DB2Test" -Dsurefire.timeout=1200

    - name: Report skipped tests
      if: always()
      run: |
        python3 - <<'PY'
        from pathlib import Path
        import xml.etree.ElementTree as ET

        skipped = [
            f"{testcase.get('classname')}.{testcase.get('name')}: {skipped_node.get('message') or 'no reason provided'}"
            for report in sorted(Path("target/surefire-reports").glob("TEST-*.xml"))
            for testcase in ET.parse(report).getroot().findall(".//testcase")
            for skipped_node in [testcase.find("skipped")]
            if skipped_node is not None
        ]

        if skipped:
            print("Skipped tests:")
            print("\n".join(f"- {test}" for test in skipped))
        else:
            print("No skipped tests in the generated Surefire reports.")
        PY

  non_integration:
    runs-on: ubuntu-latest
    name: Non-integration tests
    env:
      TESTCONTAINERS_CONFIG_FILE: src/test/resources/testcontainers-ci.properties
      DOCKER_HOST: unix:///var/run/docker.sock
      TESTCONTAINERS_DOCKER_SOCKET_OVERRIDE: /var/run/docker.sock

    steps:
    - uses: actions/checkout@v7
    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'
        server-id: github # Value of the distributionManagement/repository/id field of the pom.xml
        settings-path: ${{ github.workspace }} # location for the settings.xml file

    - name: Check Docker info
      run: docker info

    - name: Get version
      run: |
        project_version="\${project.version}"
        version="$(mvn -q -Dexec.executable=echo -Dexec.args="$project_version" --non-recursive exec:exec)"
        echo "version=$version" >> "$GITHUB_ENV"

    - name: Non-integration tests (exclude Oracle cross-version)
      run: mvn -B test --file pom.xml -Dtest="org/replicadb/*Test,org/replicadb/cli/*Test,org/replicadb/manager/*Test,org/replicadb/config/*Test,org/replicadb/rowset/*Test,org/replicadb/file/*Test,!org/replicadb/oracle/Oracle2OracleCrossVersionLobTest"

    - name: Report skipped tests
      if: always()
      run: |
        python3 - <<'PY'
        from pathlib import Path
        import xml.etree.ElementTree as ET

        skipped = [
            f"{testcase.get('classname')}.{testcase.get('name')}: {skipped_node.get('message') or 'no reason provided'}"
            for report in sorted(Path("target/surefire-reports").glob("TEST-*.xml"))
            for testcase in ET.parse(report).getroot().findall(".//testcase")
            for skipped_node in [testcase.find("skipped")]
            if skipped_node is not None
        ]

        if skipped:
            print("Skipped tests:")
            print("\n".join(f"- {test}" for test in skipped))
        else:
            print("No skipped tests in the generated Surefire reports.")
        PY

  server:
    runs-on: ubuntu-latest
    name: Server module
    env:
      TESTCONTAINERS_CONFIG_FILE: src/test/resources/testcontainers-ci.properties
      DOCKER_HOST: unix:///var/run/docker.sock
      TESTCONTAINERS_DOCKER_SOCKET_OVERRIDE: /var/run/docker.sock

    steps:
    - uses: actions/checkout@v7
    - name: Check Docker info
      run: docker info
    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'
        server-id: github # Value of the distributionManagement/repository/id field of the pom.xml
        settings-path: ${{ github.workspace }} # location for the settings.xml file

    - name: Install CLI artifact
      run: mvn -B install -DskipTests --file pom.xml

    - name: Test server module
      run: mvn -B test --file replicadb-server/pom.xml

    - name: Verify Phase 3.1 repository bridge is removed
      run: |
        if grep -R -En 'claimById|claimNextPending|public void markSucceeded\(UUID runId, long|public void markFailed\(UUID runId, long|public void markCancelled\(UUID runId, long|public void markCancelRequested|public void markPendingCancelled' replicadb-server/src/main/java; then
          echo "Deprecated Phase 3.1 repository signatures remain"
          exit 1
        fi

    - name: Verify worker profile context
      run: mvn -B -Dtest=WorkerRuntimeConfigurationTest,WorkerProfileContextTest test --file replicadb-server/pom.xml

    - name: Verify migration and observability contracts
      run: mvn -B -Dtest=FlywayMigrationTest,HealthEndpointTest,ManagementConfigurationTest,MetricsEndpointIT,WorkerManagementEndpointIT test --file replicadb-server/pom.xml

    - name: Verify deployment documentation
      run: scripts/check-phase3-docs.sh

    - name: Package server artifact
      run: mvn -B package -DskipTests --file replicadb-server/pom.xml

    - name: Smoke-test server image
      run: scripts/phase3-image-smoke.sh

    - name: Validate Compose configuration
      env:
        POSTGRES_PASSWORD: ci-placeholder
        REPLICADB_BOOTSTRAP_ADMIN_USERNAME: ci-placeholder
        REPLICADB_BOOTSTRAP_ADMIN_PASSWORD: ci-placeholder
        COMPOSE_PROFILES: multinode
      run: docker compose -f docker-compose.server.yml config --quiet

    - name: Verify packaged frontend assets
      run: test -f replicadb-server/target/classes/static/index.html

  multi_node:
    runs-on: ubuntu-latest
    needs: server
    timeout-minutes: 60
    name: Multi-node resilience and load
    env:
      TESTCONTAINERS_CONFIG_FILE: src/test/resources/testcontainers-ci.properties
      DOCKER_HOST: unix:///var/run/docker.sock
      TESTCONTAINERS_DOCKER_SOCKET_OVERRIDE: /var/run/docker.sock

    steps:
    - uses: actions/checkout@v7
    - name: Check Docker info
      run: docker info
    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'
        server-id: github
        settings-path: ${{ github.workspace }}
    - name: Install CLI artifact
      run: mvn -B install -DskipTests --file pom.xml
    - name: Run named multinode profile
      run: mvn -B -DskipTests -Pphase3-multinode verify --file replicadb-server/pom.xml
    - name: Run short concurrent load validation
      env:
        PHASE3_LOAD_RUNS: '4'
      run: scripts/phase3-load-test.sh
    - name: Run bounded chaos validation
      run: scripts/phase3-chaos-test.sh
    - name: Upload multi-node diagnostics
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: phase3-multinode-diagnostics
        path: |
          .phase3-logs
          replicadb-server/target/surefire-reports

  phase3_4:
    runs-on: ubuntu-latest
    needs: server
    timeout-minutes: 45
    name: Phase 3.4 fairness
    env:
      TESTCONTAINERS_CONFIG_FILE: src/test/resources/testcontainers-ci.properties
      DOCKER_HOST: unix:///var/run/docker.sock
      TESTCONTAINERS_DOCKER_SOCKET_OVERRIDE: /var/run/docker.sock
      PHASE3_FAIRNESS_RUNS: '24'
      PHASE3_FAIRNESS_TOLERANCE: '0.75'

    steps:
    - uses: actions/checkout@v7
    - name: Check Docker info
      run: docker info
    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'
        server-id: github
        settings-path: ${{ github.workspace }}
    - name: Install CLI artifact
      run: mvn -B install -DskipTests --file pom.xml
    - name: Run focused Phase 3.4 policy and metrics tests
      run: mvn -B -Dtest=WorkerAdmissionPolicyTest,ContentionBackoffTest,WorkerAdmissionQueueTest,WorkerBusySlotTrackerTest,ManagedRuntimeMetricsTest,WorkerDispatchCoordinatorTest test --file replicadb-server/pom.xml
    - name: Run reproducible fairness harness
      run: scripts/phase3-fairness-test.sh
    - name: Upload fairness diagnostics
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: phase3-4-fairness-diagnostics
        path: |
          .phase3-logs
          replicadb-server/target/surefire-reports

  cli_compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    name: Standalone CLI compatibility

    steps:
    - uses: actions/checkout@v7
    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'
        server-id: github
        settings-path: ${{ github.workspace }}
    - name: Run standalone CLI compatibility gate
      run: scripts/phase3-cli-compatibility.sh

  frontend_e2e:
    runs-on: ubuntu-latest
    needs: server
    timeout-minutes: 20
    name: Frontend E2E
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: replicadb
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d replicadb"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
    - uses: actions/checkout@v7
    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'
        server-id: github
        settings-path: ${{ github.workspace }}
    - name: Set up Node 22
      uses: actions/setup-node@v7
      with:
        node-version: '22'
        cache: npm
        cache-dependency-path: replicadb-server/frontend/package-lock.json
    - name: Create ephemeral bootstrap password
      run: |
        echo "REPLICADB_BOOTSTRAP_ADMIN_USERNAME=frontend-admin" >> "$GITHUB_ENV"
        echo "REPLICADB_BOOTSTRAP_ADMIN_PASSWORD=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
    - name: Install CLI artifact
      run: mvn -B install -DskipTests --file pom.xml
    - name: Package server module
      env:
        DB_URL: jdbc:postgresql://localhost:5432/replicadb
        DB_USERNAME: postgres
        DB_PASSWORD: ''
        SPRING_PROFILES_ACTIVE: api
      run: mvn -B package -DskipTests --file replicadb-server/pom.xml
    - name: Install frontend dependencies
      working-directory: replicadb-server/frontend
      run: npm ci
    - name: Install Playwright Chromium
      working-directory: replicadb-server/frontend
      run: npx playwright install --with-deps chromium
    - name: Start API
      env:
        DB_URL: jdbc:postgresql://localhost:5432/replicadb
        DB_USERNAME: postgres
        DB_PASSWORD: ''
        SPRING_PROFILES_ACTIVE: api
        REPLICADB_SERVER_LOCAL_SEEDING_ENABLED: 'true'
      run: |
        set -euo pipefail
        keyring_file=/tmp/replicadb-master-key.json
        printf '{"currentVersion":"ci","keys":{"ci":"%s"}}\n' "$(openssl rand -base64 32)" > "$keyring_file"
        chmod 600 "$keyring_file"
        export REPLICADB_SECURITY_MASTER_KEY_FILE="$keyring_file"
        echo "REPLICADB_SECURITY_MASTER_KEY_FILE=$keyring_file" >> "$GITHUB_ENV"
        nohup java -Dspring.profiles.active=api -Dreplicadb.server.local-seeding.enabled=true -jar replicadb-server/target/replicadb-server-0.1.0-SNAPSHOT.jar > /tmp/replicadb-server-e2e.log 2>&1 &
        echo $! > /tmp/replicadb-server-e2e.pid
    - name: Wait for API health
      run: |
        set -euo pipefail
        curl --retry 60 --retry-delay 1 --retry-connrefused -fsS http://localhost:8080/actuator/health >/dev/null || {
          cat /tmp/replicadb-server-e2e.log
          exit 1
        }
    - name: Seed frontend fixtures
      working-directory: replicadb-server/frontend
      env:
        REPLICADB_API_URL: http://localhost:8080
      run: node scripts/seed-local-jobs.mjs
    - name: Run frontend smoke test and API type drift check
      working-directory: replicadb-server/frontend
      env:
        PLAYWRIGHT_CHANNEL: chromium
        PLAYWRIGHT_BASE_URL: http://localhost:8080
      run: |
        set -euo pipefail
        npm run test:e2e
        OPENAPI_SCHEMA_OUTPUT="$RUNNER_TEMP/schema.ts" npm run generate:api-types
        diff -u src/api/schema.ts "$RUNNER_TEMP/schema.ts"
    - name: Upload Playwright diagnostics
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: frontend-playwright-report
        path: |
          replicadb-server/frontend/playwright-report
          replicadb-server/frontend/test-results
    - name: Stop API
      if: always()
      run: |
        if [ -f /tmp/replicadb-server-e2e.pid ]; then
          kill "$(cat /tmp/replicadb-server-e2e.pid)" || true
        fi
        rm -f /tmp/replicadb-master-key.json

  package:
    runs-on: ubuntu-latest
    needs:
      - integration
      - non_integration
      - server
      - multi_node
      - phase3_4
      - cli_compatibility
      - frontend_e2e
    name: Package release

    steps:
    - uses: actions/checkout@v7
    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'
        server-id: github # Value of the distributionManagement/repository/id field of the pom.xml
        settings-path: ${{ github.workspace }} # location for the settings.xml file

    - name: Check Docker info
      run: docker info

    - name: Get version
      run: |
        project_version="\${project.version}"
        version="$(mvn -q -Dexec.executable=echo -Dexec.args="$project_version" --non-recursive exec:exec)"
        echo "version=$version" >> "$GITHUB_ENV"

    - name: Clean Install
      run: |
        export REPLICADB_RELEASE_VERSION=${{ env.version }}
        echo ${REPLICADB_RELEASE_VERSION}  
        mvn clean install -Dmaven.javadoc.skip=true -DskipTests -B -q -P release 
        cp ./target/ReplicaDB-*.jar . 
        mkdir lib
        echo ${REPLICADB_RELEASE_VERSION} 
        cp ./target/lib/* ./lib 
        tar -zcvf ReplicaDB-v${REPLICADB_RELEASE_VERSION}.tar.gz ReplicaDB-*.jar README.md lib conf bin LICENSE 
        zip -r -X ReplicaDB-v${REPLICADB_RELEASE_VERSION}.zip ReplicaDB-*.jar README.md lib conf bin LICENSE 
        ls -lahtr
