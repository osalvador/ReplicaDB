# This workflow will build a Java project with Maven
# For more information see: https://help.github.com/actions/language-and-framework-guides/building-and-testing-java-with-maven

name: Only CI/CT

on:
  push:
    branches: [ master ]
    paths-ignore:
      - 'README.md'
      - 'docs/**'
  pull_request:
    branches: [ master ]
  workflow_dispatch:
  workflow_call:
    inputs:
      full:
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  TESTCONTAINERS_REUSE_ENABLE: 'false'

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      oracle-lob: ${{ steps.scope.outputs.oracle-lob }}
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - id: scope
      env:
        BASE: ${{ github.event.pull_request.base.sha }}
      run: |
        set -euo pipefail
        if [[ -z "$BASE" ]]; then
          echo "oracle-lob=true" >> "$GITHUB_OUTPUT"
        else
          paths=$(git diff --name-only "$BASE" HEAD -- pom.xml src/main/java/ \
            src/test/java/org/replicadb/oracle/ src/test/java/org/replicadb/config/ReplicadbOracleContainer.java \
            src/test/resources/oracle/ ':(glob)src/test/resources/sinks/oracle*' \
            .github/workflows/CT_Push.yml .github/workflows/oracle-lob-tests.yml)
          if [[ -n "$paths" ]]; then
            echo "oracle-lob=true" >> "$GITHUB_OUTPUT"
          fi
        fi

  oracle_lob:
    needs: changes
    if: needs.changes.outputs.oracle-lob == 'true'
    uses: ./.github/workflows/oracle-lob-tests.yml

  copy_benchmark:
    if: inputs.full
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-java@v6
      with:
        java-version: '17'
        distribution: temurin
        cache: maven
        cache-dependency-path: pom.xml
    - run: mvn -B test -Dtest=PostgresqlBinaryCopyBenchmarkTest -Dreplicadb.test.copy-benchmark=true

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TESTCONTAINERS_CONFIG_FILE: src/test/resources/testcontainers-ci.properties
      DOCKER_HOST: unix:///var/run/docker.sock
      TESTCONTAINERS_DOCKER_SOCKET_OVERRIDE: /var/run/docker.sock
      REPLICADB_TEST_DB2_IMAGE: icr.io/db2_community/db2:11.5.9.0
    strategy:
      fail-fast: false
      matrix:
        source:
          - db2
          - mariadb
          - mysql
          - oracle
          - postgres
          - sqlite
          - sqlserver
          - mongo
    name: Integration (${{ matrix.source }})

    steps:
    - uses: actions/checkout@v7
    - name: Set up JDK 17
      uses: actions/setup-java@v6
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven
        cache-dependency-path: |
          pom.xml
          replicadb-server/pom.xml
        server-id: github # Value of the distributionManagement/repository/id field of the pom.xml
        settings-path: ${{ github.workspace }} # location for the settings.xml file

    - name: Check Docker info
      run: docker info

    - name: Free disk space for Oracle integration images
      if: matrix.source == 'oracle'
      run: |
        sudo rm -rf /usr/local/lib/android/sdk /usr/share/dotnet /opt/ghc
        sudo docker system prune --all --force --volumes
        df -h /

    - name: Download DB2 image
      if: matrix.source == 'db2'
      run: |
        set -euo pipefail
        if timeout 120s docker pull "$REPLICADB_TEST_DB2_IMAGE" 2>&1 | tee "$RUNNER_TEMP/db2-pull.log"; then
          exit 0
        else
          status=$?
        fi
        if [[ "$status" == 124 ]] || grep -Eiq 'timeout|deadline exceeded|connection reset|unexpected EOF|429 Too Many Requests|50[234]' "$RUNNER_TEMP/db2-pull.log"; then
          timeout 120s docker pull "$REPLICADB_TEST_DB2_IMAGE"
        else
          exit 1
        fi

    - name: Integration tests
      env:
        SOURCE: ${{ matrix.source }}
        FULL: ${{ inputs.full || false }}
      run: |
        set -euo pipefail
        tests="org/replicadb/$SOURCE/*Test,!org/replicadb/oracle/Oracle2OracleCrossVersionLobTest"
        if [[ "$SOURCE" == db2 && "$FULL" != true ]]; then
          # Exercise DB2 itself and both directions against PostgreSQL with one DB2 container.
          tests='DB22DB2Test,Db2ManagerWatermarkTest'
          tests+=',DB22PostgresTest#testDb22PostgresCompleteParallelSourceQueryWithoutColumnOptions+testDb2ParallelProjectionAvoidsPartitionAliasCollision+testDb2ParallelProjectionRejectsDuplicateLabels'
          tests+=',Postgres2DB2Test#testPostgres2Db2DBCompleteAtomic+testPostgres2Db2DBIncrementalParallel'
        elif [[ "$SOURCE" == db2 ]]; then
          tests+=",**/*2DB2Test,**/*2Db2Test"
        else
          tests+=",!**/*2DB2Test,!**/*2Db2Test"
        fi
        mvn -B test --file pom.xml -Dtest="$tests" -Dsurefire.timeout=1200

    - name: Publish integration reports
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: cli-tests-${{ matrix.source }}
        path: target/surefire-reports/TEST-*.xml
        retention-days: 7

  non_integration:
    runs-on: ubuntu-latest
    name: Non-integration tests
    env:
      TESTCONTAINERS_CONFIG_FILE: src/test/resources/testcontainers-ci.properties
      DOCKER_HOST: unix:///var/run/docker.sock
      TESTCONTAINERS_DOCKER_SOCKET_OVERRIDE: /var/run/docker.sock

    steps:
    - uses: actions/checkout@v7
    - name: Set up JDK 17
      uses: actions/setup-java@v6
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven
        cache-dependency-path: |
          pom.xml
          replicadb-server/pom.xml
        server-id: github # Value of the distributionManagement/repository/id field of the pom.xml
        settings-path: ${{ github.workspace }} # location for the settings.xml file

    - name: Check Docker info
      run: docker info

    - name: Non-integration tests
      run: mvn -B test --file pom.xml -Dtest="**/*Test,!org/replicadb/db2/**,!org/replicadb/mariadb/**,!org/replicadb/mysql/**,!org/replicadb/oracle/**,!org/replicadb/postgres/**,!org/replicadb/sqlite/**,!org/replicadb/sqlserver/**,!org/replicadb/mongo/**,!org/replicadb/file/Csv2DB2Test"

    - name: Publish CLI reports
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: cli-tests-other
        path: target/surefire-reports/TEST-*.xml
        retention-days: 7

  server:
    runs-on: ubuntu-latest
    name: Server module
    timeout-minutes: 30
    env:
      TESTCONTAINERS_CONFIG_FILE: src/test/resources/testcontainers-ci.properties
      DOCKER_HOST: unix:///var/run/docker.sock
      TESTCONTAINERS_DOCKER_SOCKET_OVERRIDE: /var/run/docker.sock

    steps:
    - uses: actions/checkout@v7
    - name: Check Docker info
      run: docker info
    - name: Set up JDK 17
      uses: actions/setup-java@v6
      with:
        java-version: '17'
        distribution: 'temurin'
        server-id: github # Value of the distributionManagement/repository/id field of the pom.xml
        settings-path: ${{ github.workspace }} # location for the settings.xml file

    - name: Cache server Maven dependencies
      uses: actions/cache@v5
      with:
        path: ~/.m2/repository
        key: server-maven-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pom.xml', 'replicadb-server/pom.xml') }}
        restore-keys: server-maven-${{ runner.os }}-${{ runner.arch }}-

    - name: Install CLI artifact
      run: mvn -B install -DskipTests --file pom.xml

    - name: Test and package server module
      run: mvn -B package --file replicadb-server/pom.xml

    - name: Publish server test reports
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: server-unit-reports
        path: replicadb-server/target/surefire-reports/TEST-*.xml
        retention-days: 7

    - name: Verify Phase 3.1 repository bridge is removed
      run: |
        if grep -R -En 'claimById|claimNextPending|public void markSucceeded\(UUID runId, long|public void markFailed\(UUID runId, long|public void markCancelled\(UUID runId, long|public void markCancelRequested|public void markPendingCancelled' replicadb-server/src/main/java; then
          echo "Deprecated Phase 3.1 repository signatures remain"
          exit 1
        fi

    - name: Verify deployment documentation
      run: scripts/check-phase3-docs.sh

    - name: Upload tested server package
      uses: actions/upload-artifact@v7
      with:
        name: tested-server-jar
        path: replicadb-server/target/replicadb-server-*.jar
        if-no-files-found: error
        retention-days: 3

    - name: Smoke-test server image
      run: scripts/phase3-image-smoke.sh

    - name: Smoke-test GCP Cloud Run portability
      run: scripts/phase5-gcp-portability-smoke.sh

    - name: Create ephemeral master keyring
      run: |
        set -euo pipefail
        keyring_file=/tmp/replicadb-master-key.json
        printf '{"currentVersion":"ci","keys":{"ci":"%s"}}\n' "$(openssl rand -base64 32)" > "$keyring_file"
        chmod 600 "$keyring_file"
        echo "REPLICADB_SECURITY_MASTER_KEY_FILE=$keyring_file" >> "$GITHUB_ENV"

    - name: Validate Compose configuration
      env:
        POSTGRES_PASSWORD: ci-placeholder
        REPLICADB_BOOTSTRAP_ADMIN_USERNAME: ci-placeholder
        REPLICADB_BOOTSTRAP_ADMIN_PASSWORD: ci-placeholder
        COMPOSE_PROFILES: multinode
      run: docker compose -f docker-compose.server.yml config --quiet

    - name: Verify packaged frontend assets
      run: test -f replicadb-server/target/classes/static/index.html

  server_integration:
    runs-on: ubuntu-latest
    name: Server integration tests
    timeout-minutes: 20
    env:
      DOCKER_HOST: unix:///var/run/docker.sock
      TESTCONTAINERS_DOCKER_SOCKET_OVERRIDE: /var/run/docker.sock
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-java@v6
      with:
        java-version: '17'
        distribution: temurin
    - name: Restore server Maven dependencies
      uses: actions/cache/restore@v5
      with:
        path: ~/.m2/repository
        key: server-maven-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pom.xml', 'replicadb-server/pom.xml') }}
        restore-keys: server-maven-${{ runner.os }}-${{ runner.arch }}-
    - name: Install CLI dependency
      run: mvn -B -Dmaven.test.skip=true install --file pom.xml
    - name: Run Failsafe suite
      run: >-
        mvn -B -Dskip.installnodenpm=true -Dskip.npm=true -Dsurefire.timeout=600
        test-compile failsafe:integration-test failsafe:verify --file replicadb-server/pom.xml
    - name: Publish integration reports
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: server-integration-reports
        path: |
          replicadb-server/target/failsafe-reports/TEST-*.xml
          replicadb-server/target/failsafe-reports/*.dump*
        retention-days: 7

  multi_node:
    runs-on: ubuntu-latest
    needs: server
    timeout-minutes: 60
    name: Multi-node resilience and load
    env:
      TESTCONTAINERS_CONFIG_FILE: src/test/resources/testcontainers-ci.properties
      DOCKER_HOST: unix:///var/run/docker.sock
      TESTCONTAINERS_DOCKER_SOCKET_OVERRIDE: /var/run/docker.sock

    steps:
    - uses: actions/checkout@v7
    - name: Check Docker info
      run: docker info
    - name: Download tested server package
      uses: actions/download-artifact@v8
      with:
        name: tested-server-jar
        path: replicadb-server/target
    - name: Run multinode smoke
      run: scripts/phase3-multinode-test.sh
    - name: Run short concurrent load validation
      env:
        PHASE3_LOAD_RUNS: '4'
      run: scripts/phase3-load-test.sh
    - name: Run bounded chaos validation
      run: scripts/phase3-chaos-test.sh
    - name: Upload multi-node diagnostics
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: phase3-multinode-diagnostics
        path: |
          .phase3-logs
          replicadb-server/target/surefire-reports
        include-hidden-files: true

  embedded_postgres:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    name: Embedded PostgreSQL (${{ matrix.os }})

    steps:
    - uses: actions/checkout@v7
    - name: Set up JDK 17
      uses: actions/setup-java@v6
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven
        cache-dependency-path: |
          pom.xml
          replicadb-server/pom.xml
    - name: Check POSIX launcher prerequisites
      if: runner.os != 'Windows'
      shell: bash
      run: |
        set -euo pipefail
        java -version
        command -v bash
        command -v curl
        command -v tar
        if command -v postgres >/dev/null 2>&1; then
          echo 'embedded tests must not use system PostgreSQL' >&2
          exit 1
        fi
    - name: Check Windows launcher prerequisites
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        java -version
        Get-Command pwsh
        Get-Command taskkill
        if (Get-Command postgres -ErrorAction SilentlyContinue) {
          throw 'embedded tests must not use system PostgreSQL'
        }
    - name: Install CLI artifact
      run: mvn -B install -DskipTests --file pom.xml
    - name: Run embedded PostgreSQL profile without Docker
      shell: bash
      env:
        REPLICADB_SERVER_HOME: ${{ runner.temp }}/replicadb-server-home
      run: mvn -B -Pembedded-postgres -Dskip.installnodenpm=true -Dskip.npm=true test --file replicadb-server/pom.xml
    - name: Run Windows launcher contract
      if: runner.os == 'Windows'
      shell: pwsh
      run: ./replicadb-server/scripts/server-launcher-windows.test.ps1

  phase3_4:
    runs-on: ubuntu-latest
    needs: server
    timeout-minutes: 45
    name: Phase 3.4 fairness
    env:
      TESTCONTAINERS_CONFIG_FILE: src/test/resources/testcontainers-ci.properties
      DOCKER_HOST: unix:///var/run/docker.sock
      TESTCONTAINERS_DOCKER_SOCKET_OVERRIDE: /var/run/docker.sock
      PHASE3_FAIRNESS_RUNS: '24'
      PHASE3_FAIRNESS_TOLERANCE: '0.75'

    steps:
    - uses: actions/checkout@v7
    - name: Download tested server package
      uses: actions/download-artifact@v8
      with:
        name: tested-server-jar
        path: replicadb-server/target
    - name: Run reproducible fairness harness
      env:
        PHASE3_USE_PREBUILT_SERVER: 'true'
      run: scripts/phase3-fairness-test.sh
    - name: Upload fairness diagnostics
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: phase3-4-fairness-diagnostics
        path: |
          .phase3-logs
          replicadb-server/target/surefire-reports
        include-hidden-files: true

  cli_compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    name: Standalone CLI compatibility

    steps:
    - uses: actions/checkout@v7
    - name: Set up JDK 17
      uses: actions/setup-java@v6
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven
        cache-dependency-path: |
          pom.xml
          replicadb-server/pom.xml
        server-id: github
        settings-path: ${{ github.workspace }}
    - name: Run standalone CLI compatibility gate
      run: scripts/phase3-cli-compatibility.sh

  frontend_e2e:
    runs-on: ubuntu-latest
    needs: server
    timeout-minutes: 20
    name: Frontend E2E
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: replicadb
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d replicadb"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
    - uses: actions/checkout@v7
    - name: Set up JDK 17
      uses: actions/setup-java@v6
      with:
        java-version: '17'
        distribution: 'temurin'
        server-id: github
        settings-path: ${{ github.workspace }}
    - name: Set up Node 22
      uses: actions/setup-node@v7
      with:
        node-version: '22'
        cache: npm
        cache-dependency-path: replicadb-server/frontend/package-lock.json
    - name: Create ephemeral bootstrap password
      run: |
        echo "REPLICADB_BOOTSTRAP_ADMIN_USERNAME=frontend-admin" >> "$GITHUB_ENV"
        echo "REPLICADB_BOOTSTRAP_ADMIN_PASSWORD=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
    - name: Download tested server package
      uses: actions/download-artifact@v8
      with:
        name: tested-server-jar
        path: replicadb-server/target
    - name: Install frontend dependencies
      working-directory: replicadb-server/frontend
      run: npm ci
    - name: Install Playwright Chromium
      working-directory: replicadb-server/frontend
      run: npx playwright install --with-deps chromium
    - name: Start API
      env:
        DB_URL: jdbc:postgresql://localhost:5432/replicadb
        DB_USERNAME: postgres
        DB_PASSWORD: ''
        SPRING_PROFILES_ACTIVE: api
        REPLICADB_SERVER_LOCAL_SEEDING_ENABLED: 'true'
      run: |
        set -euo pipefail
        keyring_file=/tmp/replicadb-master-key.json
        printf '{"currentVersion":"ci","keys":{"ci":"%s"}}\n' "$(openssl rand -base64 32)" > "$keyring_file"
        chmod 600 "$keyring_file"
        export REPLICADB_SECURITY_MASTER_KEY_FILE="$keyring_file"
        echo "REPLICADB_SECURITY_MASTER_KEY_FILE=$keyring_file" >> "$GITHUB_ENV"
        server_jar=$(find replicadb-server/target -maxdepth 1 -type f -name 'replicadb-server-*.jar' ! -name '*-original.jar' -print -quit)
        test -n "$server_jar"
        nohup java -Dspring.profiles.active=api -Dreplicadb.server.local-seeding.enabled=true -jar "$server_jar" > /tmp/replicadb-server-e2e.log 2>&1 &
        echo $! > /tmp/replicadb-server-e2e.pid
    - name: Wait for API health
      run: |
        set -euo pipefail
        curl --retry 60 --retry-delay 1 --retry-connrefused -fsS http://localhost:8080/actuator/health >/dev/null || {
          cat /tmp/replicadb-server-e2e.log
          exit 1
        }
    - name: Prepare local PostgreSQL fixture
      env:
        POSTGRES_CONTAINER_ID: ${{ job.services.postgres.id }}
      run: |
        set -euo pipefail
        docker exec -i "$POSTGRES_CONTAINER_ID" psql -v ON_ERROR_STOP=1 -U postgres -d replicadb <<'SQL'
        CREATE SCHEMA IF NOT EXISTS pg2pg;
        CREATE TABLE IF NOT EXISTS pg2pg.pg2pg_source_orders (
            id BIGINT PRIMARY KEY,
            payload TEXT NOT NULL
        );
        CREATE TABLE IF NOT EXISTS pg2pg.pg2pg_destination_orders (
            id BIGINT PRIMARY KEY,
            payload TEXT NOT NULL
        );
        TRUNCATE TABLE pg2pg.pg2pg_source_orders, pg2pg.pg2pg_destination_orders;
        INSERT INTO pg2pg.pg2pg_source_orders (id, payload) VALUES
            (1, 'one'),
            (2, 'two'),
            (3, 'three');
        SQL
    - name: Seed frontend fixtures
      working-directory: replicadb-server/frontend
      env:
        REPLICADB_API_URL: http://localhost:8080
      run: node scripts/seed-local-jobs.mjs
    - name: Run frontend smoke test and API type drift check
      working-directory: replicadb-server/frontend
      env:
        PLAYWRIGHT_CHANNEL: chromium
        PLAYWRIGHT_BASE_URL: http://localhost:8080
      run: |
        set -euo pipefail
        npm run test:e2e
        OPENAPI_SCHEMA_FILE="$GITHUB_WORKSPACE/docs/openapi/replicadb-server.json" \
          OPENAPI_SCHEMA_OUTPUT="$RUNNER_TEMP/schema.ts" npm run generate:api-types
        diff -u src/api/schema.ts "$RUNNER_TEMP/schema.ts"
    - name: Upload Playwright diagnostics
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: frontend-playwright-report
        path: |
          replicadb-server/frontend/playwright-report
          replicadb-server/frontend/test-results
    - name: Stop API
      if: always()
      run: |
        if [ -f /tmp/replicadb-server-e2e.pid ]; then
          kill "$(cat /tmp/replicadb-server-e2e.pid)" || true
        fi
        rm -f /tmp/replicadb-master-key.json

  package:
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    needs:
      - oracle_lob
      - integration
      - non_integration
      - server
      - server_integration
      - multi_node
      - phase3_4
      - cli_compatibility
      - frontend_e2e
    name: Package release

    steps:
    - uses: actions/checkout@v7
    - name: Set up JDK 17
      uses: actions/setup-java@v6
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven
        cache-dependency-path: |
          pom.xml
          replicadb-server/pom.xml
        server-id: github # Value of the distributionManagement/repository/id field of the pom.xml
        settings-path: ${{ github.workspace }} # location for the settings.xml file

    - name: Check Docker info
      run: docker info

    - name: Get version
      run: |
        set -euo pipefail
        version=$(python3 -c 'import xml.etree.ElementTree as ET; print(ET.parse("pom.xml").getroot().findtext("{*}version", ""))')
        test -n "$version"
        echo "version=$version" >> "$GITHUB_ENV"

    - name: Clean Install
      run: |
        export REPLICADB_RELEASE_VERSION=${{ env.version }}
        echo ${REPLICADB_RELEASE_VERSION}  
        mvn clean install -Dmaven.javadoc.skip=true -DskipTests -B -q -P release 
        cp ./target/ReplicaDB-*.jar . 
        mkdir lib
        echo ${REPLICADB_RELEASE_VERSION} 
        cp ./target/lib/* ./lib 
        tar -zcvf ReplicaDB-v${REPLICADB_RELEASE_VERSION}.tar.gz ReplicaDB-*.jar README.md lib conf bin LICENSE 
        zip -r -X ReplicaDB-v${REPLICADB_RELEASE_VERSION}.zip ReplicaDB-*.jar README.md lib conf bin LICENSE 
        ls -lahtr
