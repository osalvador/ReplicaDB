name: Rebase Dependabot PRs

on:
  workflow_dispatch:  # Manual trigger only

permissions:
  pull-requests: write
  issues: write

jobs:
  rebase-dependabot-prs:
    runs-on: ubuntu-latest
    
    steps:
      - name: Comment on Dependabot PRs to trigger rebase
        uses: actions/github-script@v9
        with:
          script: |
            const pullRequests = await github.paginate(github.rest.pulls.list, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100
            });
            const dependabotPRs = pullRequests.filter(pr => pr.user.login === 'dependabot[bot]');
            const commentBody = '@dependabot rebase';

            console.log('Starting to comment on Dependabot PRs...');
            console.log('Total PRs to process:', dependabotPRs.length);

            for (const pullRequest of dependabotPRs) {
              try {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: pullRequest.number,
                  body: commentBody
                });

                console.log(`Successfully commented on PR #${pullRequest.number}: ${pullRequest.title}`);
                await new Promise(resolve => setTimeout(resolve, 1000));

              } catch (error) {
                console.error(`Failed to comment on PR #${pullRequest.number}:`, error.message);
              }
            }

            console.log('Done! All Dependabot PRs have been processed.');

      - name: Summary
        run: |
          {
            echo "### Dependabot Rebase Summary"
            echo ""
            echo "Commented '@dependabot rebase' on all open Dependabot PRs."
            echo ""
            echo "**Why this is needed:**"
            echo "Rebasing updates open Dependabot PRs onto the current master branch."
            echo ""
            echo "**Next steps:**"
            echo "1. Monitor CI runs - they should now pass"
            echo "2. Auto-merge workflow will merge PRs once CI passes"
          } >> "$GITHUB_STEP_SUMMARY"
