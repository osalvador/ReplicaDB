name: Documentation portal

on:
  pull_request:
    branches: [ master ]
    paths:
      - 'docs/**'
      - 'README.md'
      - 'DEPLOYMENT.md'
      - 'RELEASE_GUIDE.md'
      - 'replicadb-server/README.md'
      - 'replicadb-server/frontend/README.develop.md'
      - 'replicadb-server/frontend/src/**'
      - 'replicadb-server/frontend/e2e/**'
      - 'replicadb-server/frontend/package*.json'
      - 'replicadb-server/frontend/playwright.docs.config.ts'
      - 'replicadb-server/src/main/java/**'
      - 'replicadb-server/src/test/java/org/replicadb/server/OpenApiSpecificationIT.java'
      - 'replicadb-server/pom.xml'
      - 'scripts/check-phase3-docs.sh'
  push:
    branches: [ master ]
    paths:
      - 'docs/**'
      - 'README.md'
      - 'DEPLOYMENT.md'
      - 'RELEASE_GUIDE.md'
      - 'replicadb-server/README.md'
      - 'replicadb-server/frontend/README.develop.md'
      - 'replicadb-server/frontend/src/**'
      - 'replicadb-server/frontend/e2e/**'
      - 'replicadb-server/frontend/package*.json'
      - 'replicadb-server/frontend/playwright.docs.config.ts'
      - 'replicadb-server/src/main/java/**'
      - 'replicadb-server/src/test/java/org/replicadb/server/OpenApiSpecificationIT.java'
      - 'replicadb-server/pom.xml'
      - 'scripts/check-phase3-docs.sh'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  classify:
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.classify.outputs.api }}
      frontend: ${{ steps.classify.outputs.frontend }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: classify
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.sha }}" > /tmp/changed-files
          else
            git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" > /tmp/changed-files
          fi
          node docs/scripts/classify-changes.mjs < /tmp/changed-files > /tmp/classification.json
          echo "api=$(python3 -c 'import json; print(str(json.load(open("/tmp/classification.json"))["api"]).lower())')" >> "$GITHUB_OUTPUT"
          echo "frontend=$(python3 -c 'import json; print(str(json.load(open("/tmp/classification.json"))["frontend"]).lower())')" >> "$GITHUB_OUTPUT"

  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - name: Install docs dependencies
        working-directory: docs
        run: npm ci
      - name: Check, build, validate, and contract-test docs
        working-directory: docs
        run: npm run check && npm run build && npm run validate && npm test

  api_drift:
    if: ${{ github.event_name == 'workflow_dispatch' || needs.classify.outputs.api == 'true' }}
    runs-on: ubuntu-latest
    needs: [classify, docs]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: temurin
          cache: maven
      - name: Regenerate and compare OpenAPI
        run: |
          bash docs/scripts/update-openapi.sh
          git diff --exit-code -- docs/openapi/replicadb-server.json

  frontend_drift:
    if: ${{ github.event_name == 'workflow_dispatch' || needs.classify.outputs.frontend == 'true' }}
    runs-on: ubuntu-latest
    needs: [classify, docs]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: replicadb-server/frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: replicadb-server/frontend
        run: npm ci
      - name: Typecheck and fixture contracts
        working-directory: replicadb-server/frontend
        run: npm run typecheck && npm run test:seed && node --test scripts/seed-docs-screenshots.test.mjs