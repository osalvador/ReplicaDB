name: Issue Auto-Response Agent

on:
  issues:
    types: [opened]

permissions:
  issues: write
  contents: read

jobs:
  auto-response:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Read documentation files
        id: read-docs
        run: |
          echo "Reading documentation files..."
          
          # Create a summary of key documentation
          {
            echo "DOCS_CONTENT<<DOCS_EOF"
            echo "=== README.md Key Information ==="
            head -200 README.md
            echo ""
            echo "=== Architecture Decisions ==="
            if [ -f ARCHITECTURE_DECISIONS.md ]; then
              head -100 ARCHITECTURE_DECISIONS.md
            fi
            echo ""
            echo "=== Contributing Guidelines ==="
            if [ -f CONTRIBUTING.md ]; then
              head -100 CONTRIBUTING.md
            fi
            echo "DOCS_EOF"
          } >> $GITHUB_OUTPUT
      
      - name: Analyze issue and post automated response
        uses: actions/github-script@v7
        env:
          DOCS_CONTENT: ${{ steps.read-docs.outputs.DOCS_CONTENT }}
        with:
          script: |
            const issue = context.payload.issue;
            const issueTitle = issue.title.toLowerCase();
            const issueBody = (issue.body || '').toLowerCase();
            const issueText = issueTitle + ' ' + issueBody;
            
            // Helper function to check if text contains keywords
            function containsAny(text, keywords) {
              return keywords.some(keyword => text.includes(keyword));
            }
            
            // Detect issue type for labeling
            let issueType = null;
            let issueTypeLabels = [];
            
            // Bug detection
            if (containsAny(issueText, ['error', 'exception', 'fail', 'failed', 'crash', 'broken', 'bug', 'defect', 'incorrect', 'wrong'])) {
              issueType = 'bug';
              issueTypeLabels.push('bug');
            }
            
            // Enhancement/Feature detection
            if (containsAny(issueText, ['feature', 'enhancement', 'improvement', 'add support', 'new feature', 'would be nice', 'could you add', 'feature request'])) {
              if (issueType === null) issueType = 'enhancement';
              issueTypeLabels.push('enhancement');
            }
            
            // Question detection
            if (containsAny(issueText, ['how to', 'how do', 'how can', 'what is', 'why does', 'when should', 'where', 'question', '?']) || 
                issueTitle.includes('?')) {
              if (issueType === null) issueType = 'question';
              if (!issueTypeLabels.includes('question')) issueTypeLabels.push('question');
            }
            
            // Documentation detection
            if (containsAny(issueText, ['documentation', 'docs', 'readme', 'guide', 'tutorial', 'example', 'document'])) {
              if (issueType === null) issueType = 'documentation';
              if (!issueTypeLabels.includes('documentation')) issueTypeLabels.push('documentation');
            }
            
            // If no type detected, default to question
            if (issueType === null) {
              issueType = 'question';
              issueTypeLabels.push('question');
            }
            
            // Analyze issue content to provide relevant response
            let response = `👋 Hello @${issue.user.login}! Thank you for opening this issue.\n\n`;
            response += `🤖 **Automated Initial Response**\n\n`;
            
            // Check for common topics and provide relevant information
            let topicsFound = [];
            
            // Installation and setup
            if (containsAny(issueText, ['install', 'instalación', 'setup', 'download', 'descargar'])) {
              topicsFound.push('installation');
              response += `### 📦 Installation\n\n`;
              response += `ReplicaDB requires Java 11 or higher. You can install it in the following ways:\n\n`;
              response += `**Direct download:**\n`;
              response += `\`\`\`bash\n`;
              response += `curl -o ReplicaDB-0.18.0.tar.gz -L "https://github.com/osalvador/ReplicaDB/releases/download/v0.18.0/ReplicaDB-0.18.0.tar.gz"\n`;
              response += `tar -xvzf ReplicaDB-0.18.0.tar.gz\n`;
              response += `./bin/replicadb --help\n`;
              response += `\`\`\`\n\n`;
              response += `**Docker:**\n`;
              response += `\`\`\`bash\n`;
              response += `docker pull osalvador/replicadb:latest\n`;
              response += `docker run -it osalvador/replicadb:latest --help\n`;
              response += `\`\`\`\n\n`;
            }
            
            // Database support
            if (containsAny(issueText, ['database', 'base de datos', 'oracle', 'postgres', 'mysql', 'mongodb', 'sql server', 'db2', 'sqlite'])) {
              topicsFound.push('database');
              response += `### 🗄️ Supported Databases\n\n`;
              response += `ReplicaDB supports a wide range of databases:\n`;
              response += `- **Relational:** Oracle, PostgreSQL, MySQL/MariaDB, SQL Server, SQLite, IBM DB2 (LUW and AS/400)\n`;
              response += `- **NoSQL:** MongoDB\n`;
              response += `- **Others:** Denodo (data virtualization), CSV, Amazon S3, Kafka\n`;
              response += `- **Any JDBC-compliant database** (with some limitations)\n\n`;
              response += `For database-specific information, check the [complete documentation](https://osalvador.github.io/ReplicaDB/docs/docs.html).\n\n`;
            }
            
            // Performance and parallel execution
            if (containsAny(issueText, ['performance', 'rendimiento', 'slow', 'lento', 'parallel', 'paralelo', 'jobs', 'speed', 'velocidad'])) {
              topicsFound.push('performance');
              response += `### ⚡ Performance Optimization\n\n`;
              response += `ReplicaDB uses native parallelization for high-performance data transfers:\n\n`;
              response += `- Use the \`--jobs\` parameter to control the number of parallel threads (e.g., \`--jobs=4\`)\n`;
              response += `- Partitioning is done using database-native functions (\`ORA_HASH\`, \`HASH\`, etc.)\n`;
              response += `- Adjust \`--fetch-size\` for the JDBC cursor batch size (default 5000)\n`;
              response += `- Use \`--bandwidth-throttling\` to limit bandwidth if needed\n\n`;
              response += `**Target metrics:**\n`;
              response += `- Small tables (<100K rows): Single thread\n`;
              response += `- Medium tables (100K-10M rows): 2-4 threads, transfers in under 10 minutes\n`;
              response += `- Large tables (>10M rows): 4-8 threads\n\n`;
            }
            
            // Modes of operation
            if (containsAny(issueText, ['mode', 'modo', 'incremental', 'complete', 'atomic'])) {
              topicsFound.push('modes');
              response += `### 🔄 Replication Modes\n\n`;
              response += `ReplicaDB supports different replication modes:\n\n`;
              response += `1. **Complete Mode** (\`--mode=complete\`): Truncates and reloads the entire table\n`;
              response += `2. **Incremental Mode** (\`--mode=incremental\`): Only replicates new/modified records using timestamp or sequence\n`;
              response += `3. **Complete-Atomic Mode** (\`--mode=complete-atomic\`): Uses staging table for atomic commits\n\n`;
              response += `For incremental mode, use \`--source-where\` to specify the filter condition.\n\n`;
            }
            
            // Configuration
            if (containsAny(issueText, ['config', 'configuración', 'options', 'opciones', 'parameters', 'parámetros'])) {
              topicsFound.push('configuration');
              response += `### ⚙️ Configuration\n\n`;
              response += `ReplicaDB can be configured via:\n`;
              response += `- **CLI arguments:** \`replicadb --source-connect jdbc:... --sink-connect jdbc:...\`\n`;
              response += `- **Configuration file:** \`replicadb --options-file replicadb.conf\`\n\n`;
              response += `The configuration file supports environment variable substitution:\n`;
              response += `\`\`\`properties\n`;
              response += `source.connect=jdbc:oracle:thin:@\${ORACLE_HOST}:1521:ORCL\n`;
              response += `source.user=\${ORACLE_USER}\n`;
              response += `source.password=\${ORACLE_PASSWORD}\n`;
              response += `mode=incremental\n`;
              response += `jobs=4\n`;
              response += `\`\`\`\n\n`;
            }
            
            // Error handling
            if (containsAny(issueText, ['error', 'exception', 'fail', 'fallo', 'problema'])) {
              topicsFound.push('troubleshooting');
              response += `### 🔍 Troubleshooting\n\n`;
              response += `If you encounter errors:\n\n`;
              response += `1. **Verify connectivity:** Ensure both databases are accessible\n`;
              response += `2. **Check permissions:** \n`;
              response += `   - Source database: requires SELECT permissions\n`;
              response += `   - Sink database: requires INSERT/UPDATE/DELETE/CREATE TABLE permissions\n`;
              response += `3. **JDBC drivers:** Ensure you have the correct drivers in \`$REPLICADB_HOME/lib/\`\n`;
              response += `4. **Logs:** Check the logs for specific error details\n`;
              response += `5. **Data types:** Some conversions between databases may have limitations\n\n`;
            }
            
            // Docker usage
            if (containsAny(issueText, ['docker', 'container', 'contenedor', 'containerfile', 'dockerfile'])) {
              topicsFound.push('docker');
              response += `### 🐳 Docker Usage\n\n`;
              response += `ReplicaDB is available as a Docker image:\n\n`;
              response += `\`\`\`bash\n`;
              response += `# Run with CLI options\n`;
              response += `docker run -it osalvador/replicadb:latest \\\n`;
              response += `  --source-connect jdbc:postgresql://host.docker.internal:5432/sourcedb \\\n`;
              response += `  --source-user user --source-password pass \\\n`;
              response += `  --sink-connect jdbc:postgresql://host.docker.internal:5432/sinkdb \\\n`;
              response += `  --sink-user user --sink-password pass \\\n`;
              response += `  --mode complete --jobs 4\n\n`;
              response += `# Using configuration file\n`;
              response += `docker run -v /path/to/config:/config osalvador/replicadb:latest \\\n`;
              response += `  --options-file /config/replicadb.conf\n`;
              response += `\`\`\`\n\n`;
            }
            
            // Add general resources section
            response += `### 📚 Additional Resources\n\n`;
            response += `- 📖 [Complete documentation](https://osalvador.github.io/ReplicaDB/docs/docs.html)\n`;
            response += `- 🚀 [Quick start guide](https://github.com/osalvador/ReplicaDB#installation)\n`;
            response += `- 🏗️ [Architecture decisions](https://github.com/osalvador/ReplicaDB/blob/master/ARCHITECTURE_DECISIONS.md)\n`;
            response += `- 🤝 [Contributing guide](https://github.com/osalvador/ReplicaDB/blob/master/CONTRIBUTING.md)\n`;
            response += `- 💬 [GitHub Discussions](https://github.com/osalvador/ReplicaDB/discussions)\n\n`;
            
            // Footer
            response += `---\n\n`;
            if (topicsFound.length > 0) {
              response += `*This response was automatically generated based on detected topics: ${topicsFound.join(', ')}.*\n\n`;
            } else {
              response += `*This is an automated initial response. A maintainer will review your issue and provide additional assistance soon.*\n\n`;
            }
            response += `If you need more specific help, please provide:\n`;
            response += `- ReplicaDB version you are using\n`;
            response += `- Source and sink databases (type and version)\n`;
            response += `- Command or configuration file you are running\n`;
            response += `- Complete error messages if any\n\n`;
            response += `A human maintainer will review your issue soon! 🙂`;
            
            // Post the response
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              body: response
            });
            
            console.log('Automated response posted successfully!');
            
            // Apply type-based labels
            const labelsToAdd = ['auto-responded', ...issueTypeLabels];
            
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              labels: labelsToAdd
            });
            
            console.log(`Applied labels: ${labelsToAdd.join(', ')}`);
