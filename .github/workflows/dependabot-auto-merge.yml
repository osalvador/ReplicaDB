name: Dependabot Auto-Merge

on:
  workflow_run:
    workflows: ["Only CI/CT"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    if: github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 6

    steps:
      - name: Get PR details
        id: pr
        uses: actions/github-script@v9
        with:
          script: |
            const workflowRun = context.payload.workflow_run;
            const headOwner = workflowRun.head_repository?.owner?.login;

            if (!headOwner) {
              console.log('Workflow run has no source repository owner');
              core.setOutput('is_dependabot', 'false');
              return null;
            }

            const { data: prs } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              base: 'master',
              head: `${headOwner}:${workflowRun.head_branch}`
            });

            const pullRequest = prs.find(pr =>
              pr.user.login === 'dependabot[bot]' && pr.head.sha === workflowRun.head_sha
            );

            if (!pullRequest) {
              console.log(`No open Dependabot PR found for SHA ${workflowRun.head_sha}`);
              core.setOutput('is_dependabot', 'false');
              return null;
            }

            core.setOutput('is_dependabot', 'true');
            core.setOutput('pr_number', pullRequest.number);
            core.setOutput('pr_state', pullRequest.state);
            core.setOutput('head_sha', pullRequest.head.sha);

            console.log(`Found Dependabot PR #${pullRequest.number}`);
            return pullRequest;

      - name: Check CI status
        id: check_status
        if: steps.pr.outputs.is_dependabot == 'true'
        uses: actions/github-script@v9
        with:
          script: |
            const pr_number = ${{ steps.pr.outputs.pr_number }};
            const head_sha = '${{ steps.pr.outputs.head_sha }}';

            const { data: pullRequest } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr_number
            });

            const target = { owner: context.repo.owner, repo: context.repo.repo };
            const files = await github.paginate(github.rest.pulls.listFiles, {
              ...target, pull_number: pr_number
            });
            const expected = ['Analyze (java)', 'GitGuardian Security Checks'];
            if (files.some(file => file.filename === 'replicadb-server/pom.xml')) {
              expected.push('docs', 'api_drift', 'frontend_drift');
            }
            const acceptable = new Set(['success', 'skipped', 'neutral']);
            let ready = false;

            for (let attempt = 0; attempt < 24; attempt++) {
              const [checks, combined] = await Promise.all([
                github.paginate(github.rest.checks.listForRef, { ...target, ref: head_sha }),
                github.rest.repos.getCombinedStatusForRef({ ...target, ref: head_sha })
              ]);
              const all = [
                ...checks.map(check => ({ name: check.name, outcome: check.conclusion })),
                ...combined.data.statuses.map(status => ({
                  name: status.context, outcome: status.state === 'pending' ? null : status.state
                }))
              ];
              const failed = all.filter(check => check.outcome && !acceptable.has(check.outcome));
              if (failed.length) {
                console.log('Failed checks:', failed.map(check => check.name));
                break;
              }
              if (expected.every(name => all.some(check => check.name === name && check.outcome))
                  && all.every(check => acceptable.has(check.outcome))) {
                ready = pullRequest.state === 'open' && pullRequest.head.sha === head_sha
                  && context.payload.workflow_run.conclusion === 'success';
                break;
              }
              if (attempt < 23) await new Promise(resolve => setTimeout(resolve, 10000));
            }

            console.log('All applicable checks are ready:', ready);
            core.setOutput('ready_to_merge', ready);

      - name: Approve PR
        if: steps.pr.outputs.is_dependabot == 'true' && steps.check_status.outputs.ready_to_merge == 'true'
        uses: actions/github-script@v9
        with:
          script: |
            const pr_number = ${{ steps.pr.outputs.pr_number }};

            // Check if already approved
            const { data: reviews } = await github.rest.pulls.listReviews({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr_number
            });

            const alreadyApproved = reviews.some(review =>
              review.state === 'APPROVED' &&
              review.user.login === 'github-actions[bot]'
            );

            if (alreadyApproved) {
              console.log(`PR #${pr_number} is already approved`);
              return;
            }

            await github.rest.pulls.createReview({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr_number,
              event: 'APPROVE',
              body: '✅ Auto-approving Dependabot PR after successful CI tests.'
            });

            console.log(`Approved PR #${pr_number}`);

      - name: Merge the validated commit
        if: steps.pr.outputs.is_dependabot == 'true' && steps.check_status.outputs.ready_to_merge == 'true'
        uses: actions/github-script@v9
        with:
          script: |
            const pr_number = ${{ steps.pr.outputs.pr_number }};

            const { data: pullRequest } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr_number
            });

            // Check if already merged
            if (pullRequest.merged) {
              console.log(`PR #${pr_number} is already merged`);
              return;
            }

            await github.rest.pulls.merge({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr_number,
              sha: '${{ steps.pr.outputs.head_sha }}',
              merge_method: 'squash',
              commit_title: pullRequest.title,
              commit_message: `${pullRequest.title}\n\nAuto-merged after the applicable checks passed.`
            });
