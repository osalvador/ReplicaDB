services:
  api-one:
    environment:
      PORT: "9500"
      REPLICADB_SECURITY_KEYRING_CURRENT_VERSION: ${REPLICADB_SECURITY_KEYRING_CURRENT_VERSION:?current keyring version is required}
      REPLICADB_SECURITY_KEYRING_CURRENT_KEY: ${REPLICADB_SECURITY_KEYRING_CURRENT_KEY:?current keyring key is required}
    ports: !override
      - "127.0.0.1:9500:9500"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9500/actuator/health/liveness >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 30

  api-two:
    environment:
      REPLICADB_SECURITY_KEYRING_CURRENT_VERSION: ${REPLICADB_SECURITY_KEYRING_CURRENT_VERSION:?current keyring version is required}
      REPLICADB_SECURITY_KEYRING_CURRENT_KEY: ${REPLICADB_SECURITY_KEYRING_CURRENT_KEY:?current keyring key is required}

  worker-one:
    environment:
      REPLICADB_SECURITY_KEYRING_CURRENT_VERSION: ${REPLICADB_SECURITY_KEYRING_CURRENT_VERSION:?current keyring version is required}
      REPLICADB_SECURITY_KEYRING_CURRENT_KEY: ${REPLICADB_SECURITY_KEYRING_CURRENT_KEY:?current keyring key is required}
