############################# ReplicadB Basics #############################
## complete, complete-atomic or incremental
mode=complete

## integer greater than 0
jobs=1
fetch.size=100

## Adds a bandwidth cap for the replication in KB/sec.
#bandwidth.throttling=

## Help us to improve by activating usage analysis through the Sentry service.
# Or set up your own Sentry DSN
#sentry.dsn=${SENTRY_DSN}

## Boolean; default is false
# quoted.identifiers=false
# verbose=false

############################# Source Options #############################
source.connect=
source.user=
source.password=
source.table=
source.columns=
source.where=
## or
source.query=

## Optional Microsoft Entra authentication settings for SQL Server
# source.auth.mode=ActiveDirectoryInteractive
# source.auth.principal.id=${AZURE_CLIENT_ID}
# source.auth.login.hint=${AZURE_LOGIN_HINT}
# source.auth.client.certificate=${AZURE_CLIENT_CERTIFICATE}
# source.auth.client.key=${AZURE_CLIENT_KEY}

## Optional extra JDBC parameters
# source.connect.parameter.[parameter_name]=parameter_value

############################# Sink Options #############################
sink.connect=
sink.user=
sink.password=
sink.table=
sink.columns=

## Optional Microsoft Entra authentication settings for SQL Server
# sink.auth.mode=ActiveDirectoryDefault
# sink.auth.principal.id=${AZURE_CLIENT_ID}
# sink.auth.login.hint=${AZURE_LOGIN_HINT}
# sink.auth.client.certificate=${AZURE_CLIENT_CERTIFICATE}
# sink.auth.client.key=${AZURE_CLIENT_KEY}

## Optional extra JDBC parameters
# sink.connect.parameter.[parameter_name]=parameter_value

## Staging options for incremental mode
# sink.staging.table=
# sink.staging.table.alias=
## or
# sink.staging.schema=


## Booleans; default are false
# sink.disable.escape=false
# sink.disable.truncate=false

