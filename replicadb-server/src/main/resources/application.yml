server:
  port: 8080
spring:
  application:
    name: replicadb-server
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.mongo.MongoAutoConfiguration
management:
  prometheus:
    metrics:
      export:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
replicadb:
  server:
    execution:
      pool-size: 4
    audit:
      retention-days: 365
