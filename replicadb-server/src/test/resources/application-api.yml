spring:
  datasource:
    url: ${DB_URL:}
    username: ${DB_USERNAME:}
    password: ${DB_PASSWORD:}
  flyway:
    enabled: true
  session:
    store-type: jdbc
    jdbc:
      initialize-schema: never
    timeout: 30m
server:
  servlet:
    session:
      cookie:
        http-only: true
        secure: true
        same-site: lax
replicadb:
  security:
    bootstrap:
      enabled: false
  server:
    execution:
      pool-size: 4
